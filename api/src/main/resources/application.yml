spring:
  application:
    name: rosario-realestate-api
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:rosario_re}?useSSL=false&serverTimezone=America/Argentina/Buenos_Aires&allowPublicKeyRetrieval=true
    username: ${DB_USER:app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: false

server:
  port: ${PORT:8080}

# Observability — Phase 19
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
    prometheus:
      access: unrestricted
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}
      environment: ${APP_ENV:local}

sentry:
  dsn: ${SENTRY_DSN:}
  environment: ${APP_ENV:local}
  traces-sample-rate: 0.2
  send-default-pii: false

# WhatsApp Cloud API — Phase 10
whatsapp:
  token: ${WHATSAPP_TOKEN:}
  phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
  verify-token: ${WHATSAPP_VERIFY_TOKEN:rosario-dev}

# MercadoPago — Phase 17
mercadopago:
  access-token: ${MP_ACCESS_TOKEN:}

resilience4j:
  circuitbreaker:
    instances:
      dolarApi:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 60s
        permitted-number-of-calls-in-half-open-state: 2

logging:
  level:
    ar.com.rosario.realestate: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
